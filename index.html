<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Matrizes e Vetores</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Produto de Matrizes</h2>
            <button id="btnCalcularMatriz">Calcular</button>
            <textarea id="usermatrizA" rows="5" placeholder="ex: 1 2 3&#10;    4 5 6"></textarea>
            <textarea id="usermatrizB" rows="5" placeholder="ex: 6 5 4&#10;    3 2 1"></textarea>
            <div id="matrizC"></div>
        </div>

        <div class="card">
            <h2>Calculadora de Produto Escalar (Vetores)</h2>
            <button id="btnCalcularVetor">Calcular</button>
            <textarea id="userVetorA" rows="5" placeholder="ex: 1 0 0"></textarea>
            <textarea id="userVetorB" rows="5" placeholder="ex: 0 1 0"></textarea>
            <pre id="resultadoVetor"></pre>
        </div>
    </div>
<script src="static/script.js"></script>
</body>
</html>
